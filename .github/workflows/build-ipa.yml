name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Locus/**'
      - 'Vendor/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  ipa:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee build/xcodebuild.log

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail

          APP="build/DerivedData/Build/Products/Release-iphoneos/Locus.app"

          test -d "$APP"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )

          test -f "$APP/$EXECUTABLE"

          lipo "$APP/$EXECUTABLE" -verify_arch arm64

          mkdir -p build/ipa/Payload

          ditto "$APP" "build/ipa/Payload/Locus.app"

          (
            cd build/ipa
            zip -qry ../Locus-unsigned.ipa Payload
          )

          unzip -tq build/Locus-unsigned.ipa

          (
            cd build
            shasum -a 256 Locus-unsigned.ipa \
              > Locus-unsigned.ipa.sha256
          )

          echo "### Locus Unsigned IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the locus-unsigned-ipa artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Sign the IPA before installing on iPhone." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: locus-unsigned-ipa
          path: |
            build/Locus-unsigned.ipa
            build/Locus-unsigned.ipa.sha256
          if-no-files-found: error

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: locus-ios-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
